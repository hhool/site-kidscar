<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Kidscar | 全球童车评测</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Site Kidscar | 全球童车评测" />
  <meta property="og:description" content="全球童车评测平台：聚焦安全、操控、便携与性价比，提供可追溯的评测数据与导购建议。" />
  <meta property="og:url" content="https://www.site-kidscar.com/" />
  <meta property="og:site_name" content="Site Kidscar" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Site Kidscar | 全球童车评测" />
  <meta name="twitter:description" content="全球童车评测平台：聚焦安全、操控、便携与性价比，提供可追溯的评测数据与导购建议。" />
  <link rel="canonical" href="https://www.site-kidscar.com/" />
  <style>
    nav.site-nav { background:#0d8bff; color:#fff; padding:10px 20px; display:flex; align-items:center; gap:18px; }
    nav.site-nav a { color:#fff; text-decoration:none; font-size:15px; }
    nav.site-nav a:hover { text-decoration:underline; }
    nav.site-nav .brand { font-weight:700; font-size:17px; margin-right:auto; }
    footer.site-footer { text-align:center; padding:18px; font-size:12px; color:#7a869d; border-top:1px solid #dde4f2; margin-top:32px; }
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e2530;
      --muted: #5b677a;
      --accent: #0d8bff;
      --line: #d9e1ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 0 0, #ffffff, var(--bg));
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .hero { padding: 28px 0 12px; }
    .hero h1 { margin: 0 0 8px; font-size: 30px; }
    .hero p { margin: 0; color: var(--muted); }
    .grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .card h3 { margin: 0 0 6px; }
    .card p { margin: 0; color: var(--muted); }
    .meta { margin-top: 8px; font-size: 13px; color: #7a869d; }
    .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      text-decoration: none;
      display: inline-block;
    }
    .btn.secondary { background: #2d6bcb; }
    #app-error { margin-top: 14px; color: #b42318; }
    .search-bar { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .search-bar input, .search-bar select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      background: var(--card);
      color: var(--text);
    }
    .search-bar input { flex: 1; min-width: 180px; }
    #no-results { color: var(--muted); margin-top: 14px; display: none; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">🍼 Site Kidscar</a>
    <a href="index.html">评测列表</a>
    <a href="compare.html">车型对比</a>
  </nav>
  <div class="wrap">
    <section class="hero">
      <h1>全球童车评测平台</h1>
      <p>聚焦安全、操控、便携与性价比，提供可追溯的评测数据与导购建议。</p>
    </section>
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="搜索车型名称…" aria-label="搜索车型" />
      <select id="filter-age" aria-label="按适用年龄筛选">
        <option value="">全部年龄段</option>
        <option value="0-6m">0–6 个月</option>
        <option value="0-3y">0–3 岁</option>
        <option value="6m-4y">6 个月–4 岁</option>
      </select>
    </div>
    <section id="review-list" class="grid"></section>
    <p id="no-results">没有符合条件的评测结果。</p>
    <p id="app-error"></p>
  </div>
  <footer class="site-footer">© 2026 Site Kidscar · 数据仅供参考，购买前请自行核实。</footer>
  <script src="assets/app.js"></script>
</body>
</html>
