<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Kidscar | 全球童车评测</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e2530;
      --muted: #5b677a;
      --accent: #0d8bff;
      --line: #d9e1ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 0 0, #ffffff, var(--bg));
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .hero { padding: 28px 0 12px; }
    .hero h1 { margin: 0 0 8px; font-size: 30px; }
    .hero p { margin: 0; color: var(--muted); }
    .grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .card h3 { margin: 0 0 6px; }
    .card p { margin: 0; color: var(--muted); }
    .meta { margin-top: 8px; font-size: 13px; color: #7a869d; }
    .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      text-decoration: none;
      display: inline-block;
    }
    .btn.secondary { background: #2d6bcb; }
    #app-error { margin-top: 14px; color: #b42318; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>全球童车评测平台</h1>
      <p>聚焦安全、操控、便携与性价比，提供可追溯的评测数据与导购建议。</p>
    </section>
    <section id="review-list" class="grid"></section>
    <p id="app-error"></p>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
