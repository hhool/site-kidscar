name: deploy-vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      self_check_only:
        description: "Run self-check only (skip deploy job)"
        required: false
        type: boolean
        default: false
      healthcheck_url:
        description: "Optional absolute URL to test, e.g. https://site-kidscar.vercel.app/api/reviews?page=1&limit=1"
        required: false
        type: string

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}

    steps:
      - name: Validate Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is missing."
            echo "Set it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: VERCEL_TOKEN"
            exit 1
          fi
          if ! printf '%s' "$VERCEL_TOKEN" | grep -Eq '^vcp_[A-Za-z0-9_]+$'; then
            echo "VERCEL_TOKEN format is invalid."
            echo "Expected format: vcp_ + letters/numbers/underscore only"
            echo "Do not include quotes, bearer prefix, URLs, or expressions like \${{ secrets.VERCEL_TOKEN }}"
            exit 1
          fi
          echo "VERCEL_TOKEN format OK"

      - name: Validate healthcheck URL format (optional)
        if: ${{ inputs.healthcheck_url != '' }}
        run: |
          case "$HEALTHCHECK_URL" in
            http://*|https://*)
              echo "healthcheck_url format OK"
              ;;
            *)
              echo "healthcheck_url must be absolute URL starting with http:// or https://"
              exit 1
              ;;
          esac

      - name: API health check (optional)
        if: ${{ inputs.healthcheck_url != '' }}
        run: |
          echo "Health check: $HEALTHCHECK_URL"
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS "$HEALTHCHECK_URL" >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "Self-check API health check failed"
            exit 1
          fi
          echo "Self-check API health check OK"

  deploy:
    if: (github.event_name != 'workflow_dispatch' || inputs.self_check_only == false) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build reviews JSON
        run: bash scripts/build-reviews-json.sh

      - name: Build sitemap
        env:
          SITE_BASE_URL: https://www.site-kidscar.com
        run: bash scripts/build-sitemap.sh

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is missing."
            echo "Set it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: VERCEL_TOKEN"
            exit 1
          fi
          if ! printf '%s' "$VERCEL_TOKEN" | grep -Eq '^vcp_[A-Za-z0-9_]+$'; then
            echo "VERCEL_TOKEN format is invalid."
            echo "Expected format: vcp_ + letters/numbers/underscore only"
            echo "Do not include quotes, bearer prefix, URLs, or expressions like \${{ secrets.VERCEL_TOKEN }}"
            exit 1
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=$VERCEL_TOKEN

      - name: Build with Vercel
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: API health check
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Health check: $URL/api/reviews?page=1&limit=1"
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS "$URL/api/reviews?page=1&limit=1" >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "API health check failed"
            exit 1
          fi
          echo "API health check OK"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Vercel Preview:** ${{ steps.deploy.outputs.url }}`
            })
