name: site-kidscar-validate

on:
  push:
    paths:
      - "site-kidscar/**"
  pull_request:
    paths:
      - "site-kidscar/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-kidscar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh e2e/*.sh

      - name: Validate review JSON files
        run: |
          for file in data/reviews/*.json; do
            ./scripts/validate-review-json.sh "$file"
          done

      - name: Build frontend reviews data
        run: ./scripts/build-reviews-json.sh

      - name: Build sitemap
        run: ./scripts/build-sitemap.sh

      - name: Audit review quality
        run: ./scripts/audit-reviews.sh

      - name: Run smoke checks
        run: ./e2e/smoke-http-check.sh

      - name: Verify Cloudflare Pages config
        run: |
          test -f src/pages/_redirects && echo "_redirects OK" || (echo "_redirects missing" && exit 1)
          test -f src/pages/_headers   && echo "_headers OK"   || (echo "_headers missing" && exit 1)

      - name: Verify Vercel config
        run: |
          test -f vercel.json && echo "vercel.json OK" || (echo "vercel.json missing" && exit 1)

      - name: Verify package.json scripts
        run: |
          node -p "const p=require('./package.json'); ['build','sitemap','audit','validate','serve','smoke','preflight'].forEach(s=>{ if(!p.scripts[s]) throw new Error('missing script: '+s); }); 'package.json scripts OK'"
